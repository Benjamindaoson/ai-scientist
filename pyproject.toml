[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scientist"
version = "0.1.0"
description = "Evidence-oriented autonomous research orchestration system"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "httpx>=0.28",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
]

[project.scripts]
ai-scientist = "ai_scientist.research_store.cli:main"

[tool.setuptools]
package-dir = {"" = "auto_research/src"}

[tool.setuptools.packages.find]
where = ["auto_research/src"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
relay = ["aiohttp>=3.9"]
literature = ["sentence-transformers>=5.0"]
browser = ["playwright>=1.55"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
