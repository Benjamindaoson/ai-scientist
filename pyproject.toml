[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scientist"
version = "0.1.0"
description = "Evidence-oriented autonomous research orchestration system"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "auto_research/src"}

[tool.setuptools.packages.find]
where = ["auto_research/src"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
relay = ["aiohttp>=3.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
